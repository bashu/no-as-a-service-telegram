[project]
name = "no-as-a-service-telegram"
version = "0.1.0"
description = "Telegram bot that gives you a reason to say no"
readme = "README.md"
authors = [ { name = "Basil Sh.", email = "basil.shubin@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "environs>=15.2",
  "python-telegram-bot[rate-limiter]>=22.8",
]
